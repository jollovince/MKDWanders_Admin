<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MKDWander - Admin Sign in</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#04264B;--navy2:#0A3563;--orange:#FD7830;--gold:#FFBF49;--sky:#49C9F0;--ease:cubic-bezier(.22,1,.36,1)}
html,body{height:100%}
body{min-height:100vh;font-family:'Plus Jakarta Sans',sans-serif;color:#fff;display:grid;grid-template-columns:1.15fr 1fr;-webkit-font-smoothing:antialiased;background:#031C38;overflow-x:hidden}

/* ---------- Left: illustrated scene ---------- */
.art{position:relative;overflow:hidden;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:44px 52px;background:var(--navy)}
.scene{position:absolute;inset:0;width:100%;height:100%}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,28,56,.55) 0%,rgba(3,28,56,0) 35%,rgba(3,28,56,0) 62%,rgba(3,28,56,.7) 100%);pointer-events:none}
.brand,.copy{position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px;letter-spacing:-.02em;animation:rise 300ms ease-out both}
.brand i{width:40px;height:40px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;padding:5px}
.brand i img{width:100%;height:100%;object-fit:contain}
.brand small{display:block;font-weight:500;font-size:11px;color:rgba(255,255,255,.7);letter-spacing:0}
.copy h2{font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1.08;max-width:430px;text-shadow:0 2px 18px rgba(0,0,0,.45);animation:rise 300ms ease-out both}
.copy h2 span{color:var(--gold)}
.copy p{margin-top:12px;max-width:390px;line-height:1.6;color:rgba(255,255,255,.88);text-shadow:0 1px 8px rgba(0,0,0,.5);animation:rise 300ms ease-out 100ms both}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;animation:rise .9s var(--ease) .35s both}
.chips span{font-size:12px;font-weight:600;padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(8px);display:inline-flex;align-items:center;gap:7px}
.chips span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}

/* scene animation */
.cloud{animation:drift 60s linear infinite}
.cloud.c2{animation-duration:85s;animation-delay:-30s}
.cloud.c3{animation-duration:70s;animation-delay:-50s}
.wave{animation:wave 14s linear infinite}
.wave.w2{animation-duration:20s;animation-direction:reverse}
.wave.w3{animation-duration:10s}
.sun{transform-box:fill-box;transform-origin:center;animation:sunBob 8s ease-in-out infinite}
.glow{transform-box:fill-box;transform-origin:center;animation:glow 5s ease-in-out infinite}
.star{animation:twinkle 3s ease-in-out infinite}
.shimmer{animation:shimmer 3.2s ease-in-out infinite}
.trail{animation:dash 2.4s linear infinite}
.palm{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
.boat{animation:bob 4s ease-in-out infinite}
.foam{animation:lap 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
@keyframes lap{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1100px)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-800px)}}
@keyframes sunBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes glow{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.18);opacity:.8}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes shimmer{0%,100%{opacity:.15;transform:scaleX(.7)}50%{opacity:.55;transform:scaleX(1)}}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}

/* ---------- Right: form ---------- */
.panel{position:relative;display:flex;align-items:center;justify-content:center;padding:32px;background:radial-gradient(600px 400px at 85% 10%,rgba(73,201,240,.12),transparent 60%),radial-gradient(500px 380px at 10% 95%,rgba(253,120,48,.12),transparent 60%),#031C38}
.box{width:100%;max-width:410px;padding:36px 32px 30px;border-radius:26px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(14px);box-shadow:0 30px 70px rgba(0,0,0,.4)}
.rise{animation:rise 300ms ease-out backwards;animation-delay:calc(var(--i,0) * 100ms + 100ms)}
@keyframes rise{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:no-preference){@keyframes rise{from{opacity:0;filter:blur(4px);transform:translateY(12px)}to{opacity:1;filter:blur(0);transform:none}}}
.logo{width:84px;height:84px;border-radius:22px;background:#fff;padding:10px;display:flex;align-items:center;justify-content:center;margin-bottom:22px;box-shadow:0 14px 34px rgba(0,0,0,.35);animation:rise .8s var(--ease) both,floaty 5s ease-in-out 1s infinite}
.logo img{width:100%;height:100%;object-fit:contain}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
h1{font-size:27px;font-weight:800;letter-spacing:-.025em}
.sub{font-size:14px;color:rgba(255,255,255,.58);margin:6px 0 26px}
label{display:block;font-size:12px;font-weight:600;margin-bottom:8px;color:rgba(255,255,255,.8);letter-spacing:.02em}
.field{margin-bottom:18px}
.inp{position:relative}
.inp svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);stroke:rgba(255,255,255,.4);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke 150ms ease-out;pointer-events:none}
input{width:100%;padding:14px 16px 14px 42px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);border-radius:13px;font:inherit;font-size:15px;color:#fff;outline:none;transition:border-color 150ms ease-out,background-color 150ms ease-out,box-shadow 150ms ease-out}
input::placeholder{color:rgba(255,255,255,.28)}
input:focus{border-color:var(--gold);background:rgba(255,255,255,.09);box-shadow:0 0 0 4px rgba(255,191,73,.14);transform:translateY(-1px)}
.inp:focus-within svg{stroke:var(--gold)}
#password{padding-right:62px}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.55);cursor:pointer;padding:7px 9px;border-radius:8px;font:inherit;font-size:12px;font-weight:600;transition:color 150ms ease-out,background-color 150ms ease-out;-webkit-tap-highlight-color:transparent}
@media(hover:hover){.eye:hover{color:#fff;background:rgba(255,255,255,.08)}}
.err{display:none;font-size:13px;font-weight:500;color:#FF8A82;background:rgba(255,59,48,.1);border:1px solid rgba(255,59,48,.25);padding:11px 14px;border-radius:11px;margin-bottom:16px}
.err.show{display:block;animation:rise .35s var(--ease) both}
.btn{position:relative;overflow:hidden;width:100%;padding:15px;margin-top:6px;background:linear-gradient(135deg,var(--orange),#FF9448);color:#fff;border:none;border-radius:13px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 12px 26px rgba(253,120,48,.38);transition:transform 150ms ease-out,background-color 150ms ease-out,box-shadow 150ms ease-out;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;gap:10px}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .7s var(--ease)}
@media(hover:hover){.btn:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(253,120,48,.5)}}
@media(hover:hover){.btn:hover::after{left:130%}}
.btn:not(:disabled):active{transform:scale(.96)}
.btn:disabled{opacity:.7;cursor:wait;transform:none}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@media(prefers-reduced-motion:no-preference){.spin{animation:spin .7s linear infinite}}
.foot{margin-top:22px;text-align:center;font-size:12px;color:rgba(255,255,255,.4)}
@media(prefers-reduced-motion:no-preference){.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

@media(max-width:900px){
  body{grid-template-columns:1fr}
  .art{min-height:230px;padding:22px 24px}
  .copy h2{font-size:26px}.copy p,.chips{display:none}
  .panel{padding:20px 16px 40px;align-items:flex-start}
  .box{margin-top:-28px;position:relative;z-index:3}
}
</style>
<link rel="stylesheet" href="login-design.css">
</head>
<body>

<div class="login-backdrop" aria-hidden="true">
  <img class="travel-photo" src="images/login-el-nido.jpg" alt="" fetchpriority="high">
</div>
<header class="brand">
  <i><img src="images/logo.png" alt=""></i>
  <div>MKDWander<small>Travel &amp; Tours</small></div>
</header>
<main class="panel">
  <div class="copy">
    <h2>Every great trip <span>starts here.</span></h2>
    <p>A fresh perspective. A new adventure.</p>
  </div>
  <div class="box">
    <div class="logo"><img src="images/logo.png" alt="MKDWander logo" onerror="this.style.display='none'"></div>
    <p class="login-eyebrow">MKDWander admin portal</p>
    <h1 class="rise" style="--i:1">Welcome back.</h1>
    <p class="sub rise" style="--i:2">Sign in to manage your travel workspace.</p>
    <form id="login-form">
      <div class="field rise" style="--i:3">
        <label for="email">Email</label>
        <div class="inp">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 8 8 6 8-6"/></svg>
          <input type="email" id="email" placeholder="admin@mkdwander.com" required autocomplete="username">
        </div>
      </div>
      <div class="field rise" style="--i:3">
        <label for="password">Password</label>
        <div class="inp">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="11" width="16" height="9" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="eye" id="eye" aria-label="Show password" aria-pressed="false" aria-controls="password">Show</button>
        </div>
      </div>
      <div class="err" id="error-msg" role="alert"></div>
      <button type="submit" class="btn rise" style="--i:4" id="submit-btn">Sign in</button>
      <p class="login-status" id="login-status" role="status" aria-live="polite"></p>
    </form>
    <p class="foot rise" style="--i:4">Authorized MKDWander staff only</p>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyCpspB5e6Og8Zy4LAb--HywyjvpVbH1H5M",
  authDomain: "mkdwanders.firebaseapp.com",
  projectId: "mkdwanders",
  appId: "1:615523829055:web:1ffd2f876dcbbd0e96bf8a"
});
const auth = getAuth(app);
const $ = id => document.getElementById(id);


// The submit handler owns navigation while signing in.
let signingIn = false;
onAuthStateChanged(auth, u => { if (u && !signingIn) window.location.replace("index.html"); });

const messages = {
  "auth/invalid-credential": "Wrong email or password. Check both and try again.",
  "auth/invalid-email": "Enter a valid email address.",
  "auth/user-disabled": "This account is disabled. Contact the system owner.",
  "auth/too-many-requests": "Too many attempts. Wait a few minutes, then try again.",
  "auth/network-request-failed": "No connection. Check your internet and try again.",
  "auth/operation-not-allowed": "Email/Password sign-in is off. Enable it in Firebase Console → Authentication."
};

$("eye").onclick = () => {
  const p = $("password"), show = p.type === "password";
  p.type = show ? "text" : "password";
  $("eye").textContent = show ? "Hide" : "Show";
  $("eye").setAttribute("aria-label", show ? "Hide password" : "Show password");
  $("eye").setAttribute("aria-pressed", String(show));
};
const fields = [$("email"), $("password")];
const markInvalid = on => fields.forEach(f => {
  if (on) { f.setAttribute("aria-invalid", "true"); f.setAttribute("aria-describedby", "error-msg"); }
  else { f.removeAttribute("aria-invalid"); f.removeAttribute("aria-describedby"); }
});
fields.forEach(f => f.addEventListener("input", () => markInvalid(false)));

/* ---------- Inline sign-in feedback ---------- */
$("login-form").onsubmit = async e => {
  e.preventDefault();
  if (signingIn) return;
  const btn = $("submit-btn");
  const error = $("error-msg");
  const status = $("login-status");
  signingIn = true;
  btn.disabled = true;
  $("login-form").setAttribute("aria-busy", "true");
  error.classList.remove("show");
  error.textContent = "";
  btn.innerHTML = '<span class="spin" aria-hidden="true"></span> Signing in...';
  status.textContent = "Checking your account...";

  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
    btn.textContent = "Signed in";
    status.textContent = "Opening your dashboard...";
    window.location.replace("index.html");
  } catch (err) {
    status.textContent = "";
    error.textContent = messages[err.code] || "Could not sign in. Please try again.";
    error.classList.add("show");
    markInvalid(true);
    signingIn = false;
    btn.disabled = false;
    btn.textContent = "Sign in";
    $("login-form").setAttribute("aria-busy", "false");
    // Put the user back where they can fix it; the alert above is announced on its own
    (err.code === "auth/wrong-password" || err.code === "auth/invalid-credential" ? $("password") : $("email")).focus();
  }
};
</script>
</body>
</html>
