<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MKDWander - Admin Sign in</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#04264B;--navy2:#0A3563;--orange:#FD7830;--gold:#FFBF49;--sky:#49C9F0}
body{min-height:100vh;font-family:'Plus Jakarta Sans',sans-serif;color:#fff;display:grid;grid-template-columns:1.1fr 1fr;-webkit-font-smoothing:antialiased;background:var(--navy)}
.art{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(4,38,75,0) 0%,rgba(4,38,75,0) 60%,rgba(3,28,56,.78) 100%),url('images/banner.jpg') center/cover no-repeat,linear-gradient(135deg,var(--navy),var(--navy2) 60%,#0F4C8A);display:flex;flex-direction:column;justify-content:flex-end;padding:56px}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.art h2{position:relative;text-shadow:0 2px 14px rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.5);font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.1;max-width:420px}
.art p{position:relative;margin-top:12px;text-shadow:0 1px 8px rgba(0,0,0,.6);color:#fff;max-width:380px;line-height:1.6}
.panel{display:flex;align-items:center;justify-content:center;padding:32px;background:#031C38}
.box{width:100%;max-width:390px;animation:in .5s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.logo{width:112px;height:112px;border-radius:28px;background:#fff;padding:12px;display:flex;align-items:center;justify-content:center;margin-bottom:26px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.logo img{width:100%;height:100%;object-fit:contain}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.sub{font-size:14px;color:rgba(255,255,255,.55);margin:6px 0 30px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;color:rgba(255,255,255,.8)}
.field{margin-bottom:18px;position:relative}
input{width:100%;padding:14px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);border-radius:12px;font:inherit;font-size:15px;color:#fff;outline:none;transition:.2s}
input::placeholder{color:rgba(255,255,255,.28)}
input:focus{border-color:var(--gold);background:rgba(255,255,255,.09);box-shadow:0 0 0 4px rgba(255,191,73,.12)}
.eye{position:absolute;right:10px;bottom:9px;background:none;border:none;color:rgba(255,255,255,.55);cursor:pointer;padding:6px 8px;font:inherit;font-size:12px;font-weight:600}
.eye:hover{color:#fff}
.err{display:none;font-size:13px;font-weight:500;color:#FF8A82;background:rgba(255,59,48,.1);border:1px solid rgba(255,59,48,.25);padding:11px 14px;border-radius:10px;margin-bottom:16px}
.err.show{display:block}
.btn{width:100%;padding:14px;margin-top:6px;background:var(--orange);color:#fff;border:none;border-radius:12px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 10px 24px rgba(253,120,48,.35);transition:.15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.6;cursor:wait}
.link{background:none;border:none;color:var(--sky);font:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-top:16px;display:block}
.link:hover{text-decoration:underline}
.ok{display:none;font-size:13px;color:#7EE2A0;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);padding:11px 14px;border-radius:10px;margin-bottom:16px}
.ok.show{display:block}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
@media(max-width:820px){body{grid-template-columns:1fr}.art{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<section class="art" aria-hidden="true">
  <h2>Plan the trips. Answer the travelers.</h2>
  <p>Manage packages, promos and booking inquiries for the MKDWander app in one place.</p>
</section>
<main class="panel">
  <div class="box">
    <div class="logo"><img src="images/logo.png" alt="MKDWander logo" onerror="this.style.display='none'"></div>
    <h1>Admin sign in</h1>
    <p class="sub">Use your MKDWander admin account.</p>
    <form id="login-form">
      <div class="field"><label for="email">Email</label><input type="email" id="email" placeholder="admin@mkdwander.com" required autocomplete="username"></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" placeholder="••••••••" required autocomplete="current-password"><button type="button" class="eye" id="eye">Show</button></div>
      <div class="err" id="error-msg" role="alert"></div>
      <button type="submit" class="btn" id="submit-btn">Sign in</button>
    </form>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyCpspB5e6Og8Zy4LAb--HywyjvpVbH1H5M",
  authDomain: "mkdwanders.firebaseapp.com",
  projectId: "mkdwanders",
  appId: "1:615523829055:web:1ffd2f876dcbbd0e96bf8a"
});
const auth = getAuth(app);
const $ = id => document.getElementById(id);

onAuthStateChanged(auth, u => { if (u) window.location.replace("index.html"); });

const messages = {
  "auth/invalid-credential": "Wrong email or password. Check both and try again.",
  "auth/invalid-email": "Enter a valid email address.",
  "auth/user-disabled": "This account is disabled. Contact the system owner.",
  "auth/too-many-requests": "Too many attempts. Wait a few minutes, then try again.",
  "auth/network-request-failed": "No connection. Check your internet and try again.",
  "auth/operation-not-allowed": "Email/Password sign-in is off. Enable it in Firebase Console → Authentication."
};
const showErr = m => { $("error-msg").textContent = m; $("error-msg").classList.add("show"); };

$("eye").onclick = () => {
  const p = $("password"), show = p.type === "password";
  p.type = show ? "text" : "password";
  $("eye").textContent = show ? "Hide" : "Show";
};

$("login-form").onsubmit = async e => {
  e.preventDefault();
  $("error-msg").classList.remove("show");
  const btn = $("submit-btn");
  btn.disabled = true; btn.textContent = "Signing in...";
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
    window.location.replace("index.html");
  } catch (err) {
    showErr(messages[err.code] || "Could not sign in: " + err.message);
    btn.disabled = false; btn.textContent = "Sign in";
  }
};

</script>
</body>
</html>
